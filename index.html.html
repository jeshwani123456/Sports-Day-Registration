<!DOCTYPE html>
<html>
<head>
    <title>Sports Day Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4ff;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            text-align: center;
            color: #174ea6;
        }

        p {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .gender label,
        .agreement label {
            display: inline;
            font-weight: normal;
        }

        button {
            padding: 10px 18px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .register {
            background-color: green;
            color: white;
        }

        .clear {
            background-color: #dc3545;
            color: white;
        }

        #message {
            color: green;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Sports Day Registration Form</h1>
    <p>Register here to participate in Sports Day events!</p>

    <hr>

    <form id="registrationForm">

        <label>Student Name:</label>
        <input type="text" name="studentname" required>

        <label>Roll Number:</label>
        <input type="text" name="rollnumber" required>

        <label>Email Address:</label>
        <input type="email" name="email" required>

        <label>Phone Number:</label>
        <input type="tel" name="phone"
               pattern="[0-9]{10}"
               maxlength="10"
               title="Enter a 10-digit phone number"
               required>

        <label>Department:</label>
        <select name="department" required>
            <option value="">Select Department</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="IT">IT</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
        </select>

        <label>Year of Study:</label>
        <select name="year" required>
            <option value="">Select Year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
        </select>

        <label>Gender:</label>
        <div class="gender">
            <input type="radio" name="gender"
                   value="Male" required> Male

            <input type="radio" name="gender"
                   value="Female"> Female
        </div>

        <label>Select Sports Event:</label>
        <select name="sport" required>
            <option value="">Choose a Sport</option>
            <option value="Running Race">Running Race</option>
            <option value="Cricket">Cricket</option>
            <option value="Football">Football</option>
            <option value="Volleyball">Volleyball</option>
            <option value="Badminton">Badminton</option>
            <option value="Kabaddi">Kabaddi</option>
            <option value="Long Jump">Long Jump</option>
            <option value="Shot Put">Shot Put</option>
        </select>

        <label>Event Date:</label>
        <input type="date" name="eventdate" required>

        <br><br>

        <div class="agreement">
            <input type="checkbox" id="agreement"
                   name="agreement" required>
            <label for="agreement">
                I agree to participate in the selected sports event.
            </label>
        </div>

        <button type="submit" class="register">
            Register
        </button>

        <button type="reset" class="clear">
            Clear Form
        </button>

        <p id="message" role="status" aria-live="polite"></p>

    </form>

    <hr>

    <p>Organized by the College Sports Committee</p>

</div>

<script>
    const form = document.getElementById("registrationForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        message.textContent =
            "Registration Successfully Completed!";

        message.style.color = "green";

        alert("Registration Successfully Completed!");
    });

    form.addEventListener("reset", function() {
        message.textContent = "";
    });
</script>

</body>
</html>
